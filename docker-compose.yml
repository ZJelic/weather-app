version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: weather-redis
    ports:
      - "6379:6379"
    # Added --requirepass to enable password authentication
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    environment:
      # Pass password to container for healthcheck
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    # Added -a ${REDIS_PASSWORD} to authenticate before ping
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - weather-network

  weather-app:
    build: .
    container_name: weather-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      # Added Redis password for Spring Boot to connect
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:weatherdb
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - weather-network

volumes:
  redis-data:

networks:
  weather-network:
    driver: bridge