# Test Profile Configuration - Used only when running integration tests
api:
  key: test-api-key-for-unit-tests

spring:
  cache:
    type: caffeine  # In-memory cache for tests (faster, no Redis)
  
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password:

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    circuitbreakers:
      enabled: true

# Disable circuit breaker for tests (prevents fallback interference)
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 100  # Never open circuit (100% failure needed)
        wait-duration-in-open-state: 1ms  # Minimum 1 millisecond (NOT 0)
        permitted-number-of-calls-in-half-open-state: 3
    instances:
      weather-api:
        base-config: default