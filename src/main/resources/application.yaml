spring:
  application:
    name: weather-app

  datasource:
    url: jdbc:h2:mem:weatherdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  # Cache Configuration
  cache:
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=300s

server:
  port: 8080
  error:
    include-message: always

weather:
  api:
    base-url: https://api.open-meteo.com/v1
    timeout: 3s

resilience4j:
  circuitbreaker:
    instances:
      weather-api:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  retry:
    instances:
      weather-api:
        max-attempts: 3
        wait-duration: 1s
        retry-exceptions:
          - org.springframework.web.reactive.function.client.WebClientResponseException
          - java.net.SocketTimeoutException
  ratelimiter:
    instances:
      weather-api:
        limit-for-period: 5
        limit-refresh-period: 60s
        timeout-duration: 5s
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches
  endpoint:
    health:
      show-details: always
  metrics:
    cache:
      instrument: true

logging:
  level:
    com.project.weather: DEBUG
    org.springframework.cache: TRACE
    org.springframework.context: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level [%X{correlationId}] %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: dev
  cache:
    type: caffeine  # No Redis, in-memory only
---
spring:
  config:
    activate:
      on-profile: prod
  cache:
    type: redis     # Use Redis cache
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2